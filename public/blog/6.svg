<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050f18"/>
      <stop offset="50%" stop-color="#0d1a2e"/>
      <stop offset="100%" stop-color="#130d2e"/>
    </linearGradient>
    <radialGradient id="glow6a" cx="35%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow6b" cx="70%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg6)"/>
  <rect width="1200" height="675" fill="url(#glow6a)"/>
  <rect width="1200" height="675" fill="url(#glow6b)"/>

  <!-- Mobile phone outline - centered left -->
  <g transform="translate(380, 100)">
    <rect x="0" y="0" width="170" height="300" rx="22" ry="22" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
    <rect x="8" y="8" width="154" height="284" rx="16" ry="16" fill="#0c1f35" opacity="0.6"/>
    <!-- Camera notch -->
    <rect x="60" y="12" width="50" height="10" rx="5" fill="#0891b2" opacity="0.4"/>
    <!-- Screen content lines -->
    <rect x="20" y="40" width="130" height="8" rx="4" fill="#38bdf8" opacity="0.25"/>
    <rect x="20" y="58" width="90" height="6" rx="3" fill="#7c3aed" opacity="0.3"/>
    <rect x="20" y="74" width="110" height="6" rx="3" fill="#38bdf8" opacity="0.2"/>
    <!-- App tiles -->
    <rect x="20" y="100" width="34" height="34" rx="8" fill="#0891b2" opacity="0.3"/>
    <rect x="62" y="100" width="34" height="34" rx="8" fill="#7c3aed" opacity="0.3"/>
    <rect x="104" y="100" width="34" height="34" rx="8" fill="#0891b2" opacity="0.25"/>
    <rect x="20" y="144" width="34" height="34" rx="8" fill="#7c3aed" opacity="0.25"/>
    <rect x="62" y="144" width="34" height="34" rx="8" fill="#0891b2" opacity="0.3"/>
    <rect x="104" y="144" width="34" height="34" rx="8" fill="#7c3aed" opacity="0.3"/>
    <!-- Home indicator -->
    <rect x="60" y="280" width="50" height="4" rx="2" fill="#38bdf8" opacity="0.3"/>
  </g>

  <!-- Neural network nodes emanating from the phone screen -->
  <!-- Layer 1 nodes (from phone) -->
  <g fill="#38bdf8" opacity="0.7">
    <circle cx="600" cy="200" r="8"/>
    <circle cx="600" cy="337" r="8"/>
    <circle cx="600" cy="474" r="8"/>
  </g>
  <!-- Layer 2 nodes -->
  <g fill="#7c3aed" opacity="0.65">
    <circle cx="740" cy="140" r="7"/>
    <circle cx="740" cy="250" r="7"/>
    <circle cx="740" cy="360" r="7"/>
    <circle cx="740" cy="470" r="7"/>
    <circle cx="740" cy="540" r="7"/>
  </g>
  <!-- Layer 3 nodes -->
  <g fill="#a78bfa" opacity="0.6">
    <circle cx="880" cy="200" r="7"/>
    <circle cx="880" cy="310" r="7"/>
    <circle cx="880" cy="420" r="7"/>
    <circle cx="880" cy="530" r="7"/>
  </g>
  <!-- Layer 4 nodes -->
  <g fill="#c084fc" opacity="0.55">
    <circle cx="1010" cy="250" r="7"/>
    <circle cx="1010" cy="370" r="7"/>
    <circle cx="1010" cy="490" r="7"/>
  </g>

  <!-- Connections layer 1 to 2 -->
  <g stroke="#38bdf8" stroke-width="0.8" opacity="0.18">
    <line x1="600" y1="200" x2="740" y2="140"/>
    <line x1="600" y1="200" x2="740" y2="250"/>
    <line x1="600" y1="200" x2="740" y2="360"/>
    <line x1="600" y1="337" x2="740" y2="140"/>
    <line x1="600" y1="337" x2="740" y2="250"/>
    <line x1="600" y1="337" x2="740" y2="360"/>
    <line x1="600" y1="337" x2="740" y2="470"/>
    <line x1="600" y1="337" x2="740" y2="540"/>
    <line x1="600" y1="474" x2="740" y2="360"/>
    <line x1="600" y1="474" x2="740" y2="470"/>
    <line x1="600" y1="474" x2="740" y2="540"/>
  </g>

  <!-- Connections layer 2 to 3 -->
  <g stroke="#7c3aed" stroke-width="0.8" opacity="0.16">
    <line x1="740" y1="140" x2="880" y2="200"/>
    <line x1="740" y1="250" x2="880" y2="200"/>
    <line x1="740" y1="250" x2="880" y2="310"/>
    <line x1="740" y1="360" x2="880" y2="310"/>
    <line x1="740" y1="360" x2="880" y2="420"/>
    <line x1="740" y1="470" x2="880" y2="420"/>
    <line x1="740" y1="470" x2="880" y2="530"/>
    <line x1="740" y1="540" x2="880" y2="530"/>
    <line x1="740" y1="140" x2="880" y2="310"/>
    <line x1="740" y1="540" x2="880" y2="420"/>
  </g>

  <!-- Connections layer 3 to 4 -->
  <g stroke="#a78bfa" stroke-width="0.8" opacity="0.15">
    <line x1="880" y1="200" x2="1010" y2="250"/>
    <line x1="880" y1="310" x2="1010" y2="250"/>
    <line x1="880" y1="310" x2="1010" y2="370"/>
    <line x1="880" y1="420" x2="1010" y2="370"/>
    <line x1="880" y1="420" x2="1010" y2="490"/>
    <line x1="880" y1="530" x2="1010" y2="490"/>
    <line x1="880" y1="200" x2="1010" y2="370"/>
    <line x1="880" y1="530" x2="1010" y2="370"/>
  </g>

  <!-- Connector from phone to network -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.3" stroke-dasharray="6 4">
    <line x1="554" y1="200" x2="600" y2="200"/>
    <line x1="554" y1="250" x2="600" y2="337"/>
    <line x1="554" y1="300" x2="600" y2="474"/>
  </g>

  <!-- Feature labels -->
  <g font-family="sans-serif" font-size="11" fill="#67e8f9" opacity="0.5" text-anchor="start">
    <text x="1025" y="254">On-device ML</text>
    <text x="1025" y="374">Personalization</text>
    <text x="1025" y="494">Inference</text>
  </g>

  <!-- Background particles -->
  <g opacity="0.07" fill="#38bdf8">
    <circle cx="120" cy="80" r="2"/>
    <circle cx="200" cy="580" r="2"/>
    <circle cx="1150" cy="100" r="2"/>
    <circle cx="1100" cy="600" r="2"/>
    <circle cx="80" cy="400" r="1.5"/>
    <circle cx="300" cy="620" r="1.5"/>
  </g>
</svg>
